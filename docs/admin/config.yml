# Sveltia CMS configuration — https://randolin.github.io/IronCircle/admin/
# GENERATED by tools/build-cms-config.py — edit that script, not this file.
#
# Edit pages in the browser; Save = a commit to `main`, which triggers the normal
# Pages deploy. Sign-in is GitHub OAuth; you need write access to the repo.
#
# Things to know:
#   - Sveltia only saves fields declared here. Anything else in a page's
#     frontmatter is DROPPED on save. New field in a folder -> add it to the script.
#   - No nested collections yet, so every leaf folder is its own collection.
#     New folder -> add it to the script.
#   - Cadwallon bodies are edited in raw Markdown only: the rich-text editor
#     rewrites wikilinks, callouts and Dataview blocks.
#   - Slugs keep Title Case and spaces so [[Wikilinks]] keep resolving.
#     Apostrophes are stripped from NEW file names ("S'ylice" -> "S ylice").
#   - backend.base_url is the OAuth relay (sveltia-cms-auth on Cloudflare
#     Workers). Replace the placeholder after deploying it.

backend:
  name: github
  repo: Randolin/IronCircle
  branch: main
  base_url: https://sveltia-cms-auth.aaron-g-holloway.workers.dev
site_url: https://randolin.github.io/IronCircle/
display_url: https://randolin.github.io/IronCircle/
media_folder: /docs/assets/uploads
public_folder: /assets/uploads
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: ' '
  lowercase: false
output:
  omit_empty_optional_fields: true
  yaml:
    quote: none
collections:
- name: root
  label: Site
  icon: home
  files:
  - name: home
    label: Landing page
    file: docs/index.md
    fields:
    - label: Title
      name: title
      widget: string
      required: false
    - label: Body
      name: body
      widget: markdown
      modes:
      - raw
      - rich_text
      required: false
  - name: documentation
    label: Documentation index
    file: docs/Documentation/index.md
    fields:
    - label: Title
      name: title
      widget: string
      required: false
    - label: Body
      name: body
      widget: markdown
      modes:
      - raw
      - rich_text
      required: false
- divider: true
